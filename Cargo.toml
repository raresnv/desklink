[package]
name = "desklink"
default-run = "desklink"
version = "0.3.3"
edition = "2021"
rust-version = "1.89"
description = "Consent-based, encrypted remote desktop in Rust"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:enigo", "dep:xcap", "dep:image", "dep:local-ip-address", "dep:dispatch2", "dep:core-graphics", "dep:objc2", "dep:objc2-foundation", "dep:objc2-screen-capture-kit", "dep:objc2-core-media", "dep:objc2-core-video", "dep:block2", "dep:windows", "dep:core-foundation"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bincode = "1.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
snow = "0.9.6"
zeroize = { version = "1", features = ["derive"] }
url = "2.5"
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite intentionally enables no crypto provider. Keep one enabled in
# production too; the tokio-rustls dev dependency previously masked this in tests.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", features = ["sink"] }
directories = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
x25519-dalek = "2"
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"], optional = true }
enigo = { version = "0.3", optional = true }
xcap = { version = "0.9.10", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
local-ip-address = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", optional = true }
dispatch2 = { version = "0.3.1", optional = true }
core-graphics = { version = "0.24", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSError", "NSString"] }
objc2-screen-capture-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-media", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rcgen = "0.14"

[[bin]]
name = "desklink"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "desklink-relay"
path = "src/bin/relay.rs"

[[example]]
name = "demo_host"
required-features = ["desktop"]

[[example]]
name = "session_probe"
required-features = ["desktop"]

[[example]]
name = "stream_probe"
required-features = ["desktop"]

[[test]]
name = "macos_layout"
harness = false
required-features = ["desktop"]

[profile.release]
lto = "thin"
strip = true

[[example]]
name = "capture_probe"
required-features = ["desktop"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Variant", "Win32_System_Ole", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_HiDpi"] }
